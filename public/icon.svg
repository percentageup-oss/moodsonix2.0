<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141F" />
      <stop offset="100%" stop-color="#0A0A0F" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AEE820" />
      <stop offset="100%" stop-color="#C8F542" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" stroke="#20202A" stroke-width="4" fill="none" opacity="0.6" />
  
  <!-- Soundwaves / Monogram M -->
  <g filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="136" y="216" width="28" height="80" rx="14" fill="url(#limeGrad)" />
    <!-- Bar 2 -->
    <rect x="184" y="156" width="28" height="200" rx="14" fill="url(#limeGrad)" />
    <!-- Bar 3 -->
    <rect x="232" y="116" width="28" height="280" rx="14" fill="url(#limeGrad)" />
    <!-- Bar 4 -->
    <rect x="280" y="176" width="28" height="160" rx="14" fill="url(#limeGrad)" />
    <!-- Bar 5 -->
    <rect x="328" y="236" width="28" height="40" rx="14" fill="url(#limeGrad)" />
  </g>

  <!-- Accent dot -->
  <circle cx="380" cy="256" r="8" fill="#C8F542" />
</svg>
